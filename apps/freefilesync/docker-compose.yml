services:
  freefilesync:
    image: 'jlesage/freefilesync:v26.08.2'
    x-runtipi:
      is_main: true
      internal_port: '5800'
    environment:
      - TZ=Europe/Budapest
      - USER_ID=1000
      - GROUP_ID=1000
      - KEEP_APP_RUNNING=1
      - DARK_MODE=0
      # Ha a Runtipin kivulrol (nem csak LAN-rol) is elerheto lesz ez az app,
      # mindenkepp kapcsold be az alabbi harmat es adj meg jelszot/felhasznalonevet:
      # - WEB_AUTHENTICATION=1
      # - WEB_AUTHENTICATION_USERNAME=changeme
      # - WEB_AUTHENTICATION_PASSWORD=changeme
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      # A docker host azon utvonala, ahol a Debian gep tartalma elerheto.
      # Ez kerul be a konteneren belul /storage ala, a FreeFileSync ezt
      # fogja latni forraskent.
      - /mnt/nas:/storage
x-runtipi:
  schema_version: 2
