services:
  searxng:
    image: docker.io/searxng/searxng:2026.10.24-ef0ec03da
    container_name: searxng
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - ${APP_DATA_DIR}/data/config:/etc/searxng
      - ${APP_DATA_DIR}/data/cache:/var/cache/searxng
    labels:
      runtipi.managed: true
    x-runtipi:
      is_main: true
      internal_port: 8080

x-runtipi:
  schema_version: 2
