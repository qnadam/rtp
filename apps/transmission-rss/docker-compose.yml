services:
  transmission-rss:
    # FONTOS: cseréld le qnadam-t a saját GitHub felhasználó-/
    # szervezetnevedre, miután lefutott a build-transmission-rss.yml workflow
    # legalább egyszer (Actions fülön "Run workflow" -> onnantól létezik
    # a ghcr.io/<te>/transmission-rss:latest image).
    image: ghcr.io/qnadam/transmission-rss:latest
    container_name: transmission-rss
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${APP_DATA_DIR}/data/transmission-rss.conf:/etc/transmission-rss.conf:ro
      - ${APP_DATA_DIR}/data/state:/data
    labels:
      runtipi.managed: true

x-runtipi:
  schema_version: 2
