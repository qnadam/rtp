services:
  transmission-rss:
    image: ghcr.io/qnadam/transmission-rss:latest
    container_name: transmission-rss
    restart: unless-stopped
    # Ruby alapból pufferelve írja a stdout-ot, ha nem terminálra megy
    # (mint egy konténerben) - emiatt a "docker logs" sokáig üresnek
    # tűnhet, miközben a program rendben fut. Ez kényszeríti ki az
    # azonnali (unbuffered) kiírást.
    command: ["ruby", "-e", "STDOUT.sync = true; STDERR.sync = true; load '/usr/bin/transmission-rss'"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${APP_DATA_DIR}/data/transmission-rss.conf:/etc/transmission-rss.conf:ro
      - ${APP_DATA_DIR}/data/state:/data
    labels:
      runtipi.managed: true

x-runtipi:
  schema_version: 2
