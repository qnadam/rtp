name: Build transmission-rss image

on:
  schedule:
    - cron: '0 5 * * 1'   # hetente hétfőn 05:00 UTC
  workflow_dispatch: {}    # kézi indítás az Actions fülről

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/transmission-rss
  UPSTREAM_REPO: nning/transmission-rss
  UPSTREAM_REF: main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v5
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream

      - name: Patch Dockerfile for current Alpine ruby packaging
        # A Ruby 3.4 több régi "default gem"-et (getoptlong, base64, rss,
        # stb.) kiszervezett külön csomagokba. Az Alpine "ruby-full"
        # meta-package ezeket mind behúzza egyben, a ruby-yaml-t pedig
        # külön kell kérni (community repo-s csomag, ezt a ruby-full nem
        # tartalmazza). Így nem kell egyenként kergetni a hiányzó darabokat.
        run: |
          sed -i 's/apk add --no-cache ruby ruby-etc ruby-json/apk add --no-cache ruby-full ruby-yaml/' upstream/Dockerfile

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: vars
        run: |
          SHA=$(git -C upstream rev-parse --short HEAD)
          echo "tag=$(date +%Y%m%d)-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: upstream
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
